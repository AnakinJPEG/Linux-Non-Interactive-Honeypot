<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Internal Portal</title>
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <h1>Sign in</h1>
  <!-- Decoy form: action points nowhere; submissions are logged by nginx -->
  <form action="/login" method="post" autocomplete="off">
    <label>User <input name="u" type="text"></label>
    <label>Pass <input name="p" type="password"></label>
    <button type="submit">Continue</button>
  </form>
</body>
</html>
